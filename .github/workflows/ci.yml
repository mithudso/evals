name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: '0.13.7'
      - uses: ./.github/actions/private-dependency
        with:
          deploy-key: ${{ secrets.OLLAMA_CLIENT_DEPLOY_KEY }}
      - run: uv sync --extra dev --frozen --python ${{ matrix.python }}
      - run: make check
      - run: make build
      - name: Remove dependency key
        if: always()
        run: rm -f "$RUNNER_TEMP/ollama-client-key" "$RUNNER_TEMP/ollama-client-known-hosts"

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - uses: ./.github/actions/private-dependency
        with:
          deploy-key: ${{ secrets.OLLAMA_CLIENT_DEPLOY_KEY }}
      - run: uv sync --extra dev --frozen
      - run: make audit
      - name: Remove dependency key
        if: always()
        run: rm -f "$RUNNER_TEMP/ollama-client-key" "$RUNNER_TEMP/ollama-client-known-hosts"
